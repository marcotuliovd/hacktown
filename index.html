<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mapa HackTown 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--roxo:#8B0FD4;--lima:#C8F000;--esc:#8D0DC6;--chrome:#150E1C;--pan:#1E1527;--bd:#3A2D49;--tx:#F2ECF7;--mut:#A897B8}
html,body{height:100%}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--esc);color:var(--tx);
 height:100dvh;overflow:hidden;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--pan);border-bottom:1px solid var(--bd);z-index:20}
.logo{font-size:13px;font-weight:900;letter-spacing:1.4px;white-space:nowrap;line-height:1.15}
.logo b{display:block;color:var(--lima);font-size:15px;letter-spacing:1.1px}
#sw{position:relative;flex:1;max-width:460px}
#bs{width:100%;background:#120C18;border:1.5px solid var(--bd);color:var(--tx);border-radius:10px;
 padding:11px 38px 11px 40px;font:inherit;font-size:15px;outline:none}
#bs:focus{border-color:var(--lima)}
#sw .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none;font-size:15px}
#sx{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mut);
 font-size:20px;cursor:pointer;padding:4px 8px;display:none;line-height:1}
#sw.has #sx{display:block}
#sug{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--pan);border:1px solid var(--bd);
 border-radius:10px;box-shadow:0 14px 34px #000b;max-height:min(60vh,420px);overflow:auto;display:none;z-index:30}
#sug.on{display:block}
.sg{display:flex;gap:11px;align-items:center;padding:9px 12px;cursor:pointer;border-bottom:1px solid #271F32}
.sg:last-child{border-bottom:0}.sg:hover,.sg.hi{background:#2E2340}
.sg .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--lima);color:#151019;font-size:12px;font-weight:900;display:grid;place-items:center}
.sg .t{font-size:14px}.sg .t small{display:block;color:var(--mut);font-size:12px}
.empty{padding:14px;color:var(--mut);font-size:13.5px}
button.b{background:#2E2340;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:11px 14px;
 font:inherit;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap}
button.b:hover{background:#3A2C50}
button.b.on{background:var(--lima);color:#151019;border-color:var(--lima)}
button.b.pri{background:var(--roxo);border-color:var(--roxo);color:#fff}
main{flex:1;display:flex;min-height:0;position:relative}
#stage{flex:1;position:relative;overflow:hidden;background:var(--esc);touch-action:none;cursor:grab}
#stage.pan{cursor:grabbing}#stage.pinmode{cursor:crosshair}
#world{position:absolute;transform-origin:0 0;user-select:none;-webkit-user-select:none}
#world svg{display:block;width:100%;height:100%}
.pin{position:absolute;width:0;height:0}
.pin .mk{position:absolute;transform:translate(-50%,-50%) scale(var(--ps,1));display:grid;place-items:center;
 width:28px;height:28px;border-radius:50%;background:var(--lima);color:#151019;font-size:13px;font-weight:900;
 border:2px solid #fff;box-shadow:0 2px 8px #000a;cursor:pointer;transition:background .15s}
.pin.dim{opacity:.18}.pin.act{z-index:8}
.pin.act .mk{background:#fff}
.pin.act .ring{position:absolute;transform:translate(-50%,-50%) scale(var(--ps,1));width:28px;height:28px;
 border-radius:50%;border:3px solid var(--lima);animation:pulse 1.6s ease-out infinite;pointer-events:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 #C8F000AA}70%{box-shadow:0 0 0 22px #C8F00000}100%{box-shadow:0 0 0 0 #C8F00000}}
body.edit .pin .mk{cursor:move}

#zc{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:7px;z-index:10}
#zc button{width:44px;height:44px;border-radius:12px;background:#1E1527E8;border:1px solid var(--bd);color:#fff;font-size:19px;font-weight:800;cursor:pointer}
#zc button:hover{background:#2E2340}
#card{position:absolute;left:14px;bottom:14px;width:min(340px,calc(100% - 76px));background:var(--pan);border:1px solid var(--bd);
 border-left:4px solid var(--lima);border-radius:12px;padding:13px 15px;box-shadow:0 12px 32px #000a;display:none;z-index:12}
#card.on{display:block}
#card .h{display:flex;gap:11px;align-items:flex-start}
#card .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--lima);color:#151019;font-size:13px;font-weight:900;display:grid;place-items:center}
#card h2{font-size:16.5px;line-height:1.25}#card p{color:var(--mut);font-size:13.5px;margin-top:3px}
#cx{position:absolute;right:8px;top:8px;background:none;border:0;color:var(--mut);font-size:19px;cursor:pointer;line-height:1;padding:3px 6px}
#guia{width:296px;flex:none;background:var(--chrome);border-left:1px solid var(--bd);overflow:auto}
#guia.off{display:none}
#guia h3{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--lima);padding:13px 15px 8px;font-weight:900;position:sticky;top:0;background:var(--chrome)}
.gi{display:flex;gap:10px;padding:7px 15px;border-bottom:1px solid #271F32;cursor:pointer;align-items:center}
.gi:hover{background:#2A2137}.gi.act{background:#33254A}
.gi .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--lima);color:#151019;font-size:11.5px;font-weight:900;display:grid;place-items:center}
.gi.np .n{background:#3D3346;color:#8B7D99}
.gi .t{font-size:13px;line-height:1.25}.gi .t small{display:block;color:var(--mut);font-size:11.5px}
#hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#150E1CD9;border:1px solid var(--bd);
 color:var(--mut);font-size:12px;padding:6px 13px;border-radius:20px;pointer-events:none;transition:.4s;z-index:9}
#hint.off{opacity:0}
/* ---- editor ---- */
#ed{display:none;width:330px;background:var(--pan);border-right:1px solid var(--bd);flex-direction:column;min-height:0}
body.edit #ed{display:flex}
body.edit #bl{display:none}
#ed .pad{padding:11px;border-bottom:1px solid var(--bd);display:flex;flex-wrap:wrap;gap:6px}
#ed .pad button{flex:1;min-width:calc(50% - 3px);padding:8px;font-size:12.5px}
#el{flex:1;overflow:auto}
#ef{padding:11px;border-top:1px solid var(--bd)}
#ef label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:8px 0 3px;font-weight:800}
#ef input{width:100%;background:#120C18;border:1px solid var(--bd);color:var(--tx);border-radius:7px;padding:7px 9px;font:inherit;font-size:13px}
.rw{display:flex;gap:6px}.rw>*{flex:1}
#toast{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:var(--lima);color:#151019;font-weight:800;
 font-size:12.5px;padding:8px 15px;border-radius:9px;opacity:0;transition:.25s;pointer-events:none;z-index:40}
#toast.on{opacity:1}
dialog{background:var(--pan);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:18px;width:min(560px,92vw)}
dialog::backdrop{background:#000b}
dialog textarea{width:100%;min-height:150px;background:#120C18;border:1px solid var(--bd);color:var(--tx);
 border-radius:7px;padding:9px;font-family:ui-monospace,monospace;font-size:12px;margin:8px 0}
@media(max-width:860px){
 header{flex-wrap:wrap;padding:9px 11px;gap:9px}
 .logo{font-size:11px}.logo b{font-size:13px}
 #sw{order:3;flex:1 0 100%;max-width:none}
 #bl{padding:9px 12px;font-size:12.5px}
 main{flex-direction:column}
 #guia{width:auto;height:40%;border-left:0;border-top:1px solid var(--bd)}
 #card{width:calc(100% - 28px)}
 #zc{bottom:auto;top:14px}
 #ed{position:absolute;inset:auto 0 0 0;width:auto;max-height:60%;z-index:18;border-right:0;border-top:1px solid var(--bd)}
}

/* ---- chancela Lei Rouanet / Petrobras ---- */
#chTop{background:#fff;color:#000;text-align:center;padding:8px 12px;font-size:13.5px;font-weight:600;
 letter-spacing:.2px;flex:none;z-index:25}
#chBot{background:#fff;flex:none;display:flex;align-items:center;justify-content:center;padding:7px 12px;z-index:25}
#chBot img{display:block;width:auto;height:auto;max-height:54px;max-width:min(96vw,760px)}
@media(max-width:860px){
 #chTop{font-size:11.5px;padding:7px 10px}
 #chBot{padding:6px 8px}
 #chBot img{max-height:44px;max-width:96vw}
}
</style>
</head>
<body>
<div id="chTop">Ministério da Cultura e Petrobras apresentam:</div>
<header>
  <div class="logo">MAPA DO<b>HACKTOWN 2026</b></div>
  <div id="sw">
    <span class="ic">⌕</span>
    <input id="bs" placeholder="Buscar local, palco, casa…" autocomplete="off" spellcheck="false">
    <button id="sx" aria-label="Limpar">×</button>
    <div id="sug"></div>
  </div>
  <button class="b" id="bl">Lista</button>
</header>
<main>
  <aside id="ed">
    <div class="pad">
      <button class="b" id="ePin">Modo pinar</button>
      <button class="b" id="eNovo">+ Local</button>
      <button class="b" id="eAZ">Ordenar A→Z</button>
      <button class="b" id="eImp">Importar</button>
      <button class="b" id="eJson">Salvar JSON</button>
      <button class="b pri" id="eSalvar">Salvar HTML</button>
    </div>
    <div id="el"></div>
    <div id="ef" style="display:none">
      <div class="rw">
        <div style="flex:0 0 70px"><label>Nº</label><input id="eNum" type="number" min="1"></div>
        <div style="flex:1"><label>Nome</label><input id="eNome"></div>
      </div>
      <label>Descrição</label><input id="eObs" placeholder="ex.: Sala 2, 2º andar">
      <div class="rw" style="margin-top:10px">
        <button class="b" id="eUp">↑</button><button class="b" id="eDown">↓</button>
        <button class="b" id="eClear">Tirar pino</button><button class="b" id="eDel">Excluir</button>
      </div>
    </div>
  </aside>
  <section id="stage">
    <div id="world"></div>
    <div id="hint">Arraste para mover · pinça ou rolagem para aproximar</div>
    <div id="card"></div>
    <div id="toast"></div>
  </section>
  <aside id="guia"><h3>Locais</h3><div id="gl"></div></aside>
</main>

  :{n:l.n,nome:l.nome,obs:l.obs||'',x:+l.x.toFixed(1),y:+l.y.toFixed(1),xn:+(l.x/W).toFixed(5),yn:+(l.y/H).toFixed(5)})}}
 $('#eJson').onclick=()=>dl('locais-hacktown-2026.json',JSON.stringify(data(),null,1),'application/json');
 $('#eSalvar').onclick=()=>{
  const js='/*D*/'+JSON.stringify(data())+'/*\/D*/';
  const novo=SRC.replace(/\/\*D\*\/[\s\S]*?\/\*\/D\*\//,()=>js);
  if(novo===SRC){toast('Erro ao gerar o arquivo');return}
  dl('mapa-hacktown-2026.html',novo,'text/html');
  toast(L.filter(l=>l.x!=null).length+' locais salvos no HTML')};
}
build();fit();setTimeout(()=>$('#hint').classList.add('off'),5000);
})();
</script>
</body>
</html>
